<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Host title stays</title>
<style>
body { margin:12px; font:16px Arial; }
.hosts { display:flex; align-items:flex-start; gap:20px; }
.hosts>div { height:740px; width:850px; flex-shrink:0; }
#second { width:380px; }
#outside { font-size:19px; color:rgb(12,34,56); }
.cross-player [data-cross-part="clue"] { border-radius:0; }
#results { white-space:pre-wrap; }
</style>
<body class="host-theme">
<h1>DOM player checks</h1>
<button id="outside" data-command="host-only">Outside button</button>
<button id="run">Run checks</button>
<pre id="results" role="status">Ready</pre>
<form><div class="hosts"><div id="first"></div><div id="second"></div></div></form>
<script type="module" src="/mount.js"></script>
</body>
